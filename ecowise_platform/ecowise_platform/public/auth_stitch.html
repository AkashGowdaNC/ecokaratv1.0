<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoKarat - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "outline-variant": "#3c4a42",
                        "on-primary": "#003824",
                        "primary": "#4edea3",
                        "background": "#101410",
                        "surface-container": "#1d211c",
                        "on-tertiary-container": "#711419",
                        "error": "#ffb4ab",
                        "outline": "#86948a",
                        "on-secondary-fixed": "#002114",
                        "surface-container-high": "#272b26",
                        "primary-fixed": "#6ffbbe",
                        "surface-container-low": "#191d18",
                        "on-surface-variant": "#bbcabf",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb3af",
                        "on-primary-fixed-variant": "#005236",
                        "surface-bright": "#363a35",
                        "secondary-fixed": "#85f8c4",
                        "on-surface": "#e0e4dc",
                        "surface-container-highest": "#323631",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-tertiary-fixed-variant": "#842225",
                        "surface": "#101410",
                        "on-secondary-fixed-variant": "#005137",
                        "on-primary-fixed": "#002113",
                        "secondary-fixed-dim": "#68dba9",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2d312c",
                        "on-primary-container": "#00422b",
                        "inverse-primary": "#006c49",
                        "tertiary-fixed": "#ffdad7",
                        "secondary": "#68dba9",
                        "tertiary-container": "#fc7c78",
                        "secondary-container": "#25a475",
                        "surface-dim": "#101410",
                        "surface-variant": "#323631",
                        "on-background": "#e0e4dc",
                        "on-secondary-container": "#00311f",
                        "primary-container": "#10b981",
                        "on-tertiary-fixed": "#410005",
                        "on-secondary": "#003825",
                        "surface-container-lowest": "#0b0f0b",
                        "surface-tint": "#4edea3",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary": "#650911",
                        "inverse-surface": "#e0e4dc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "display": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(54, 58, 53, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .neon-glow:hover {
            box-shadow: 0 0 20px rgba(78, 222, 163, 0.5);
        }
        .ghost-input {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            border-radius: 0;
            transition: all 0.3s ease;
        }
        .ghost-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(to right, theme('colors.primary'), theme('colors.primary-container')) 1;
            background-image: linear-gradient(to top, rgba(0, 66, 43, 0.1), transparent);
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<main class="flex w-full h-screen">
<!-- Left Panel: Branding & Ecosystem -->
<section class="hidden lg:flex w-1/2 relative flex-col justify-between p-12 bg-gradient-to-br from-[#062d1c] to-surface-container-lowest overflow-hidden">
<!-- Decorative Floating Elements -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 rounded-full blur-[80px] mix-blend-screen mix-blend-screen pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="z-10 mt-8">
<h1 class="font-display text-5xl font-bold tracking-tighter text-primary uppercase mb-4">
                    EcoKarat
                </h1>
<p class="font-headline text-xl text-on-surface-variant tracking-wide">
                    Scheduled Pickup · Certified Recycling · EPR Data
                </p>
</div>
<div class="z-10 mb-8 max-w-md w-full glass-panel rounded-xl p-8 border border-white/5 shadow-[0_0_40px_rgba(16,185,129,0.05)]">
<h3 class="font-display text-lg font-semibold text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">biotech</span>
                    System Access Terminal
                </h3>
<div class="space-y-4">
<div class="p-4 bg-surface-container/50 rounded-lg group hover:-translate-y-1 transition-transform duration-300">
<div class="flex items-center justify-between mb-1">
<span class="font-headline text-sm font-medium text-on-surface">demo@ecokarat.com</span>
<span class="text-xs font-headline text-primary bg-primary/10 px-2 py-0.5 rounded-full">Admin</span>
</div>
<p class="text-xs text-on-surface-variant font-body">Full ecosystem visibility</p>
</div>
<div class="p-4 bg-surface-container/50 rounded-lg group hover:-translate-y-1 transition-transform duration-300">
<div class="flex items-center justify-between mb-1">
<span class="font-headline text-sm font-medium text-on-surface">facility@ecokarat.com</span>
<span class="text-xs font-headline text-secondary bg-secondary/10 px-2 py-0.5 rounded-full">Recycler</span>
</div>
<p class="text-xs text-on-surface-variant font-body">Processing &amp; certification portal</p>
</div>
</div>
</div>
</section>
<!-- Right Panel: Authentication -->
<section class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-surface-container-lowest relative z-20">
<!-- Contextual Navigation (Mobile Only) -->
<div class="absolute top-8 left-8 lg:hidden">
<h1 class="font-display text-2xl font-bold tracking-tighter text-primary uppercase">
                    EcoKarat
                </h1>
</div>
<div class="w-full max-w-md relative">
<!-- Tab Navigation -->
<div class="flex gap-8 mb-12 border-b border-surface-container-low pb-2">
<button class="font-headline text-lg font-semibold text-primary border-b-2 border-primary pb-2 px-1 translate-y-[2px]">
                        Sign In
                    </button>
<button class="font-headline text-lg font-medium text-on-surface-variant hover:text-on-surface transition-colors pb-2 px-1">
                        Register Protocol
                    </button>
</div>
<!-- Login Form -->
<form class="space-y-8 glass-panel p-8 rounded-xl border border-white/5 shadow-[0_0_40px_rgba(16,185,129,0.05)] perspective-1000">
<div class="space-y-6">
<div class="relative">
<label class="block font-label text-xs font-medium text-on-surface-variant mb-1 uppercase tracking-wider" for="email">Operator ID (Email)</label>
<input class="ghost-input w-full px-0 py-3 text-on-surface font-body text-base placeholder-on-surface-variant/30" id="email" placeholder="enter credentials..." type="email"/>
</div>
<div class="relative">
<label class="block font-label text-xs font-medium text-on-surface-variant mb-1 uppercase tracking-wider" for="password">Access Key (Password)</label>
<input class="ghost-input w-full px-0 py-3 text-on-surface font-body text-base placeholder-on-surface-variant/30" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-background" type="checkbox"/>
<span class="text-sm font-body text-on-surface-variant group-hover:text-on-surface transition-colors">Maintain Connection</span>
</label>
<a class="text-sm font-body text-primary hover:text-primary-container transition-colors" href="#">Recover Access</a>
</div>
<button class="w-full py-4 px-6 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg tracking-wide neon-glow transition-all duration-300 flex items-center justify-center gap-2" type="button">
                        Initialize Session
                        <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">login</span>
</button>
</form>
<!-- Hidden Register Form (Structural Placeholder) -->
<div class="hidden">
<div class="grid grid-cols-2 gap-3 mb-6">
<button class="py-2 px-4 rounded-full bg-surface-container-high text-on-surface-variant font-label text-sm border border-outline-variant/30" type="button">Marriage Hall</button>
<button class="py-2 px-4 rounded-full bg-primary text-on-primary font-label text-sm font-medium" type="button">Recycler</button>
<button class="py-2 px-4 rounded-full bg-surface-container-high text-on-surface-variant font-label text-sm border border-outline-variant/30" type="button">Bottle Company</button>
<button class="py-2 px-4 rounded-full bg-surface-container-high text-on-surface-variant font-label text-sm border border-outline-variant/30" type="button">Admin</button>
</div>
</div>
</div>
</section>
</main>
</body></html>
